[alias]
# Run the desktop app
app = "run -p ez-wishlist-overlay --release"
app-dev = "run -p ez-wishlist-overlay"

# Refresh game data from upstream (maintainers)
scrape = "run -p scraper --release"

# Workspace-wide checks
t = "test --workspace"
c = "check --workspace --all-targets"
l = "clippy --workspace --all-targets -- -D warnings"
fmt = "fmt --all"
fmt-check = "fmt --all -- --check"
