# Static-link the MSVC C runtime into the final binary so the shipped exe /
# MSI never needs a Visual C++ Redistributable on the user's machine. Adds
# ~1-2 MB to the binary. Only applies when targeting MSVC; gnullvm builds
# (used for non-Windows iteration) are unaffected.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[alias]
# Run the desktop app
app = "run -p ez-wishlist-overlay --release"
app-dev = "run -p ez-wishlist-overlay"

# Refresh game data from upstream (maintainers)
scrape = "run -p scraper --release"

# Workspace-wide checks
t = "test --workspace"
c = "check --workspace --all-targets"
l = "clippy --workspace --all-targets -- -D warnings"
# Note: do NOT alias `fmt` — `cargo fmt` is a built-in subcommand and an
# alias of `fmt = "fmt --all"` shadows it and recurses forever.
fmt-check = "fmt --all -- --check"
