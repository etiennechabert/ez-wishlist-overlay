[workspace]
resolver = "2"
members = [
    "crates/app",
    "crates/scraper",
]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/etiennechabert/ez-wishlist-overlay"
authors = ["Etienne Chabert"]

[workspace.dependencies]
anyhow = "1.0.95"
thiserror = "2.0.9"
serde = { version = "1.0.217", features = ["derive"] }
serde_json = { version = "1.0.135", features = ["preserve_order"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.19", features = ["env-filter"] }
image = { version = "0.25.5", default-features = false, features = ["png", "webp", "jpeg"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
