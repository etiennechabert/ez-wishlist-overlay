name: CI

# Runs on every PR and every push to main. Parallel gates:
#  - format         : `cargo fmt --check`
#  - clippy         : strict `cargo clippy -D warnings` on Linux
#  - test           : `cargo test --workspace` on Linux
#  - windows-check  : `cargo check --workspace --all-targets` on Windows; the
#                     only build that compiles the `cfg(target_os = "windows")`
#                     VR code (openvr_sys → cmake + bindgen + bundled OpenVR
#                     SDK).
#  - windows-test   : `cargo test --workspace` on Windows; the only job that
#                     actually executes the vr/ unit tests (pitch math,
#                     anchor matrix). Linux test runs skip them via cfg.
#  - windows-msi    : Full MSI build via cargo-wix. Mirrors the release
#                     workflow exactly (shares the .github/actions/build-msi
#                     composite), so wix/main.wxs errors and cargo-wix
#                     flag mistakes surface at PR time rather than after a
#                     tag is pushed. The slowest job (~10 min cold) but it
#                     catches a class of bug that's expensive to discover
#                     post-tag.
#  - version-bump   : PR-only. Fails if `crates/app/Cargo.toml`'s version
#                     still matches (or trails) the latest released `v*`
#                     tag, so every merged PR ships with a version that's
#                     already past the last release. Pairs with release.yml's
#                     existing tag-vs-Cargo.toml guard so tagging never
#                     finds a stale version on main.

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  format:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-clippy
      # eframe → winit needs x11 headers to compile on Linux even when
      # we're only type-checking. cmake is used by some transitive deps.
      - name: Install Linux GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: test (linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-test
      - name: Install Linux GUI build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libxkbcommon-dev libssl-dev
      - run: cargo test --workspace --no-fail-fast

  windows-check:
    name: cargo check (windows, VR enabled)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-check
      # openvr_sys's build.rs runs bindgen over the bundled OpenVR C++ SDK
      # and needs libclang on PATH. cmake is preinstalled on the runner.
      - name: Install LLVM
        uses: ./.github/actions/install-llvm
      - name: cargo check
        shell: pwsh
        run: cargo check --workspace --all-targets --target x86_64-pc-windows-msvc

  windows-test:
    name: cargo test (windows, VR enabled)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-test
      - name: Install LLVM
        uses: ./.github/actions/install-llvm
      # Cross-platform Linux `test` job runs cargo test on every PR but
      # skips the vr/ module entirely (`cfg(target_os = "windows")`), so
      # the pitch-extraction math, anchor-matrix builder, and FSM
      # transitions never run there. This job is the only thing that
      # actually executes those tests.
      - name: cargo test
        shell: pwsh
        run: cargo test --workspace --target x86_64-pc-windows-msvc --no-fail-fast

  windows-msi:
    name: cargo wix (windows, MSI build)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: windows-msi
      - name: Install LLVM
        uses: ./.github/actions/install-llvm
      # Same composite the Release workflow uses — exercises the full
      # cargo build --release + cargo wix pipeline so wix manifest
      # errors and cargo-wix flag mistakes (the kind that bit the
      # v0.0.4 release) surface here instead of after a tag push.
      - name: Build MSI
        uses: ./.github/actions/build-msi

  version-bump:
    name: version bumped past latest release
    runs-on: ubuntu-latest
    # PR-only: pushes to main shouldn't fail this check (main IS the place
    # where the version eventually equals a fresh tag, between bump and
    # tagging). Forks without write access can still run it — no secrets
    # needed.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          # Need the full tag history to find the latest `v*` tag; the
          # default shallow checkout fetches no tags.
          fetch-depth: 0
      - name: Verify Cargo.toml version is ahead of latest released tag
        shell: bash
        run: |
          set -euo pipefail
          cargo_v=$(grep -m1 -E '^version *= *"' crates/app/Cargo.toml \
            | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$cargo_v" ]; then
            echo "::error file=crates/app/Cargo.toml::could not parse version"
            exit 1
          fi
          latest=$(git tag -l 'v*' | sed 's/^v//' | sort -V | tail -n1)
          echo "Cargo.toml version : $cargo_v"
          echo "Latest released tag: ${latest:-<none>}"
          if [ -z "$latest" ]; then
            echo "No v* tag exists yet — nothing to compare against; skipping."
            exit 0
          fi
          if [ "$cargo_v" = "$latest" ]; then
            echo "::error file=crates/app/Cargo.toml::version $cargo_v matches the latest released tag v$latest — bump it before merging so the next release has a fresh version to tag."
            exit 1
          fi
          # Defence-in-depth: also reject regressions, since release.yml's
          # tag-vs-Cargo.toml guard only catches them at tag-push time.
          highest=$(printf '%s\n%s\n' "$cargo_v" "$latest" | sort -V | tail -n1)
          if [ "$highest" != "$cargo_v" ]; then
            echo "::error file=crates/app/Cargo.toml::version $cargo_v is older than the latest released tag v$latest."
            exit 1
          fi
          echo "OK: $cargo_v > $latest"
