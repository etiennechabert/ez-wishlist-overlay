[package]
name = "ez-wishlist-overlay"
version = "0.0.8"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ez-wishlist-overlay"
path = "src/main.rs"

# Embed the .ico into the .exe so Explorer / Taskbar / Alt-Tab show our icon
# instead of the default Windows binary glyph.
[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image.workspace = true

eframe = { version = "0.30.0", default-features = false, features = ["default_fonts", "glow", "persistence", "x11"] }
egui = "0.30.0"
egui_extras = { version = "0.30.0", features = ["image"] }
rust-embed = { version = "8.5.0", features = ["interpolate-folder-path", "include-exclude"] }
directories = "5.0.1"
parking_lot = "0.12.3"
crossbeam-channel = "0.5.14"
time = { version = "0.3.37", features = ["formatting", "macros", "local-offset"] }
once_cell = "1.20.2"
tiny-skia = "0.11.4"
fontdue = "0.9.3"

# One-shot HTTPS GET against the GitHub releases API for the in-app update
# check. `ureq` is sync + tiny (no async runtime), which fits our single
# background thread fire-and-forget pattern. Default features include
# rustls + webpki-roots (HTTPS) and the JSON helper.
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

# VR — Windows-only. The `openvr` crate wraps Valve's OpenVR SDK; non-Windows
# targets compile the vr/overlay.rs and vr/runtime.rs Windows branches to a
# no-op so macOS/Linux dev builds stay green.
#
# Building on Windows requires a C++ toolchain, cmake, and libclang on PATH
# (openvr_sys builds the bundled OpenVR SDK + bindgen). See README.
[target.'cfg(target_os = "windows")'.dependencies]
openvr = "0.9.0"

[features]
default = []

# Convenience for `cargo wix` invoked locally without extra flags. The wxs
# uses <UIRef Id='WixUI_InstallDir'/>, which lives in WixUIExtension.
# cargo-wix 0.3.9 already passes `-ext WixUIExtension` to light.exe by
# default but NOT to candle.exe, so we only need to add it on the compile
# side. CI also passes this via `-C -ext -C WixUIExtension` on the command
# line so the metadata block isn't a single point of failure.
[package.metadata.wix]
compiler-args = ["-ext", "WixUIExtension"]
