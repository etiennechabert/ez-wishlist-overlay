[package]
name = "ez-wishlist-overlay"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ez-wishlist-overlay"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image.workspace = true

eframe = { version = "0.30.0", default-features = false, features = ["default_fonts", "glow", "persistence"] }
egui = "0.30.0"
egui_extras = { version = "0.30.0", features = ["image"] }
rust-embed = { version = "8.5.0", features = ["interpolate-folder-path", "include-exclude"] }
directories = "5.0.1"
parking_lot = "0.12.3"
crossbeam-channel = "0.5.14"
time = { version = "0.3.37", features = ["formatting", "macros", "local-offset"] }
once_cell = "1.20.2"
tiny-skia = "0.11.4"
fontdue = "0.9.3"

# VR — only used on Windows. Crate selection deferred to VR phase (Phase 3);
# evaluate `ovr_overlay`, `openvr` and raw `openvr-sys` bindings before pinning.
# [target.'cfg(windows)'.dependencies]
# ovr_overlay = "..."

[features]
default = []
