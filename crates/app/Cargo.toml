[package]
name = "ez-wishlist-overlay"
version = "0.4.5"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "ez-wishlist-overlay"
path = "src/main.rs"

# Embed the .ico into the .exe so Explorer / Taskbar / Alt-Tab show our icon
# instead of the default Windows binary glyph.
[target.'cfg(target_os = "windows")'.build-dependencies]
winresource = "0.1"

[dependencies]
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
image.workspace = true

# `accesskit` is required so the dev-only `egui_kittest` harness can drive the
# GUI tests: kittest turns on `egui/accesskit` (it queries the accessibility
# tree), and `egui-winit` only compiles against that extended `PlatformOutput`
# when its own `accesskit` feature is on too — otherwise feature unification in
# the test/check build breaks egui-winit (E0027). It's eframe's own default and
# adds OS screen-reader support to the shipped app (no extra system libs).
eframe = { version = "0.30.0", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "x11"] }
egui = "0.30.0"
egui_extras = { version = "0.30.0", features = ["image"] }
rust-embed = { version = "8.5.0", features = ["interpolate-folder-path", "include-exclude"] }
directories = "5.0.1"
parking_lot = "0.12.3"
crossbeam-channel = "0.5.14"
time = { version = "0.3.37", features = ["formatting", "macros", "local-offset"] }
once_cell = "1.20.2"
tiny-skia = "0.11.4"
fontdue = "0.9.3"
# Levenshtein distance for the OCR strict-match resolver — tolerates
# character-level OCR errors against `module.name` only; never used to
# bridge dataset drift (see crates/app/src/ocr/match_upgrade.rs).
strsim = "0.11"

# One-shot HTTPS GET against the GitHub releases API for the in-app update
# check. `ureq` is sync + tiny (no async runtime), which fits our single
# background thread fire-and-forget pattern. Default features include
# rustls + webpki-roots (HTTPS) and the JSON helper.
ureq = { version = "2.12", default-features = false, features = ["tls", "json"] }

# VR — Windows-only. The `openvr` crate wraps Valve's OpenVR SDK; non-Windows
# targets compile the vr/overlay.rs and vr/runtime.rs Windows branches to a
# no-op so macOS/Linux dev builds stay green.
#
# Building on Windows requires a C++ toolchain, cmake, and libclang on PATH
# (openvr_sys builds the bundled OpenVR SDK + bindgen). See README.
#
# `openvr_sys` is pulled in directly (not through the `openvr` safe wrapper)
# for two functions 0.9.0 omits:
#   - `SetOverlayInputMethod` / `SetOverlayFlag`, needed for the controller
#     laser to intersect the overlay (vr/overlay.rs).
#   - `IVRCompositor::GetMirrorTextureD3D11`, needed for native-resolution
#     screenshot capture (vr/capture.rs).
# Version pinned to the revision the safe wrapper uses transitively.
# `windows` is needed for the D3D11 device + staging-texture readback that
# the mirror-texture pull does.
[target.'cfg(target_os = "windows")'.dependencies]
openvr = "0.9.0"
openvr_sys = "2.1.4"
# Lossy WebP encoder (libwebp bindings) for the debug capture written at q95
# (issue #141). The `image` crate's built-in WebP encoder is lossless-only, so
# the q95 debug save goes through libwebp directly. Windows-only because the only
# call site is the Windows capture path (`vr/runtime.rs`).
webp = "0.3"
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Diagnostics_Debug",
    "Win32_UI_WindowsAndMessaging",
    # OCR (WinRT) — used by crates/app/src/ocr/engine.rs to run
    # Windows.Media.Ocr over the panel screenshot crops.
    "Foundation",
    "Foundation_Collections",
    "Globalization",
    "Graphics_Imaging",
    "Media_Ocr",
    "Storage",
    "Storage_Streams",
] }

# Headless GUI tests for the egui panes — widget interaction (click a button,
# assert the resulting state change) and theme-readability contrast checks.
# `egui_kittest` is the official 0.30 harness; pulled in with NO features so it
# brings only `kittest` + AccessKit (no `wgpu`/`image`), which keeps it building
# and running in the normal Linux `cargo test` CI job without a GPU. See
# `crates/app/src/gui/containers_pane.rs` `mod tests`.
[dev-dependencies]
egui_kittest = "0.30"

[features]
default = []

# Convenience for `cargo wix` invoked locally without extra flags. The wxs
# uses <UIRef Id='WixUI_InstallDir'/>, which lives in WixUIExtension.
# cargo-wix 0.3.9 already passes `-ext WixUIExtension` to light.exe by
# default but NOT to candle.exe, so we only need to add it on the compile
# side. CI also passes this via `-C -ext -C WixUIExtension` on the command
# line so the metadata block isn't a single point of failure.
[package.metadata.wix]
compiler-args = ["-ext", "WixUIExtension"]
