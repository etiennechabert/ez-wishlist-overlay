sonar.projectKey=etiennechabert_ez-wishlist-overlay
sonar.organization=etiennechabert

sonar.sources=crates
sonar.exclusions=**/target/**

# Files still get scanned for bugs/smells/security; they just don't
# count against the coverage %.
#   - gui/**       : egui immediate-mode rendering, needs a display server
#   - vr/**        : cfg(target_os = "windows"), Linux scan can't compile it
#   - main.rs      : bootstrap / event loop
#   - build.rs     : build script, not runtime code
#   - platform.rs  : thin OS shell-out (xdg-open / cmd start)
sonar.coverage.exclusions=**/main.rs,**/build.rs,crates/app/src/gui/**,crates/app/src/vr/**,crates/app/src/platform.rs

sonar.rust.lcov.reportPaths=lcov.info

# Cargo workspaces keep a single Cargo.lock at the repo root (./Cargo.lock,
# committed), never one per member crate. Sonar SCA looks for a lockfile
# beside each Cargo.toml and flags every member as "lock file missing".
# Scope the ignore to the member manifests so the root Cargo.toml +
# Cargo.lock are still analysed normally.
sonar.issue.ignore.multicriteria=workspaceLock
sonar.issue.ignore.multicriteria.workspaceLock.ruleKey=*
sonar.issue.ignore.multicriteria.workspaceLock.resourceKey=crates/*/Cargo.toml
